syntax = "proto3";

package review.v1;

import "google/protobuf/timestamp.proto";

// ReviewService owns product reviews and user wishlists.
service ReviewService {
  // CreateReview returns ALREADY_EXISTS if the user already reviewed the product.
  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  // DeleteReview returns PERMISSION_DENIED unless the requester is the author or an admin.
  rpc DeleteReview(DeleteReviewRequest) returns (DeleteReviewResponse);
  rpc AddToWishlist(AddToWishlistRequest) returns (AddToWishlistResponse);
  rpc RemoveFromWishlist(RemoveFromWishlistRequest) returns (RemoveFromWishlistResponse);
  rpc ListWishlist(ListWishlistRequest) returns (ListWishlistResponse);
}

message Review {
  uint64 id = 1;
  uint64 user_id = 2;
  uint64 product_id = 3;
  int32 rating = 4;
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateReviewRequest {
  uint64 user_id = 1;
  uint64 product_id = 2;
  int32 rating = 3;
  string comment = 4;
}

message CreateReviewResponse {
  Review review = 1;
}

message ListReviewsRequest {
  uint64 product_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListReviewsResponse {
  repeated Review reviews = 1;
  int64 total = 2;
}

message DeleteReviewRequest {
  uint64 review_id = 1;
  uint64 requester_id = 2;
  bool requester_is_admin = 3;
}

message DeleteReviewResponse {}

message WishlistItem {
  uint64 product_id = 1;
  google.protobuf.Timestamp added_at = 2;
}

message AddToWishlistRequest {
  uint64 user_id = 1;
  uint64 product_id = 2;
}

message AddToWishlistResponse {}

message RemoveFromWishlistRequest {
  uint64 user_id = 1;
  uint64 product_id = 2;
}

message RemoveFromWishlistResponse {}

message ListWishlistRequest {
  uint64 user_id = 1;
}

message ListWishlistResponse {
  repeated WishlistItem items = 1;
}
