syntax = "proto3";

package auth;

option go_package = "github.com/geoo115/E-commerceMicroservices/auth-service/proto";

service AuthService {
    rpc Signup(SignupRequest) returns (AuthResponse) {}
    rpc VerifyEmail(VerifyEmailRequest) returns (GenericResponse) {}
    rpc Login(LoginRequest) returns (AuthResponse) {}
    rpc ValidateToken(ValidateTokenRequest) returns (ValidateResponse) {}
}

message Address {
    string address_line1 = 1;
    string address_line2 = 2;
    string city          = 3;
    string state         = 4;
    string postal_code   = 5;
    string country       = 6;
}

message SignupRequest {
    string username  = 1;
    string password  = 2;
    string email     = 3;
    string phone     = 4;
    Address address   = 5;
}

message LoginRequest {
    string username = 1;
    string password = 2;
}

message ValidateTokenRequest {
    string token = 1;
}

message VerifyEmailRequest {
    string email = 1;
    string code  = 2;
}

message AuthResponse {
    uint64 user_id      = 1;
    string access_token = 2;
    string username     = 3;
    string email        = 4;
    string phone        = 5;
    Address address = 6;
    string role         = 7;
    string message      = 8;
}

message ValidateResponse {
    bool is_valid = 1;
    uint64 user_id = 2;
    string role    = 3;
}

message GenericResponse {
    string message = 1;
}