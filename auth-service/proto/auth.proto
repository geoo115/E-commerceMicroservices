syntax="proto3";

package auth;
option go_package ="./proto";

service AuthService{
    rpc Singup(SignupRequest)returns(AuthResponse){}
    rpc Login(LoginRequest)returns(AuthResponse){}
    rpc ValidateToken(ValidateTokenRequest)returns(validateResponse){}
}

message SignupRequest{
    string username=1;
    string password=2;
    string email=3;
    string phone=4;
}

message LoginRequest{
    string username=1;
    string password=2;
}

message ValidateTokenRequest{
    string token=1;
}

message AuthResponse{
    uint64 user_id=1;
    string token=2;
    string username=3;
    string email=4;
}

message validateResponse{
    string token=1;
}