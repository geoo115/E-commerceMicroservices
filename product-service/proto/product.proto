syntax = "proto3";

package product;

option go_package = "github.com/geoo115/E-commerceMicroservices/product-service/proto;proto";

service ProductService {
    rpc CreateProduct(CreateProductRequest) returns (ProductResponse);
    rpc GetProduct(GetProductRequest) returns (ProductResponse);
    rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
    rpc UpdateProduct(UpdateProductRequest) returns (ProductResponse);
    rpc DeleteProduct(DeleteProductRequest) returns (DeleteResponse);
    rpc SearchProducts(SearchRequest) returns (ListProductsResponse);
}

message CreateProductRequest {
    string name = 1;
    double price = 2;
    uint32 category_id = 3;
    string description = 4;
    int32 stock = 5;
}

message GetProductRequest {
    uint32 id = 1;
}

message ListProductsRequest {
    int32 page = 1;
    int32 limit = 2;
}

message UpdateProductRequest {
    uint32 id = 1;
    string name = 2;
    double price = 3;
    uint32 category_id = 4;
    string description = 5;
}

message DeleteProductRequest {
    uint32 id = 1;
}

message SearchRequest {
    string query = 1;
    string category = 2;
}

message ProductResponse {
    uint32 id = 1;
    string name = 2;
    double price = 3;
    Category category = 4;
    string description = 5;
    Inventory inventory = 6;
}

message ListProductsResponse {
    repeated ProductResponse products = 1;
}

message DeleteResponse {
    bool success = 1;
}

message Category {
    uint32 id = 1;
    string name = 2;
}

message Inventory {
    uint32 product_id = 1;
    int32 stock = 2;
}
