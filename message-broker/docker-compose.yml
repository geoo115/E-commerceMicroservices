version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  message-broker:
    build: ./message-broker
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
    restart: always

  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - product-service
      - order-service
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./api-gateway/config.yaml:/app/config.yaml