syntax = "proto3";

package inventory;

option go_package = "./proto";

// InventoryService defines operations for inventory management.
service InventoryService {
    rpc GetInventory(GetInventoryRequest) returns (InventoryResponse);
    rpc UpdateStock(UpdateStockRequest) returns (InventoryResponse);
}

message GetInventoryRequest {
    uint32 product_id = 1;
}

message UpdateStockRequest {
    uint32 product_id = 1;
    // The stock delta can be negative (deduction) or positive (restock).
    int32 delta = 2;
}

message InventoryResponse {
    uint32 product_id = 1;
    int32 stock = 2;
}
