name: ecommerce

# Shared settings for the Go services (built from the root Dockerfile).
x-service: &service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

x-env: &env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  METRICS_ADDR: ":9100"

services:
  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["15432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9094:9094"] # for services running on the host (go run)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # KRaft mode, no ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are created explicitly by the services
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # --------------------------------------------------------------------------
  # Services
  # --------------------------------------------------------------------------
  auth-service:
    <<: *service
    build: { context: ., args: { SERVICE: auth-service } }
    image: ecommerce/auth-service:local
    environment:
      <<: *env
      GRPC_ADDR: ":50051"
      DATABASE_NAME: auth
      DATABASE_USER: auth_svc
      DATABASE_PASSWORD: auth_svc
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      JWT_TTL: ${JWT_TTL:-24h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (see .env.example)}

  product-service:
    <<: *service
    build: { context: ., args: { SERVICE: product-service } }
    image: ecommerce/product-service:local
    environment:
      <<: *env
      GRPC_ADDR: ":50052"
      DATABASE_NAME: products
      DATABASE_USER: product_svc
      DATABASE_PASSWORD: product_svc

  inventory-service:
    <<: *service
    build: { context: ., args: { SERVICE: inventory-service } }
    image: ecommerce/inventory-service:local
    environment:
      <<: *env
      GRPC_ADDR: ":50057"
      DATABASE_NAME: inventory
      DATABASE_USER: inventory_svc
      DATABASE_PASSWORD: inventory_svc

  order-service:
    <<: *service
    build: { context: ., args: { SERVICE: order-service } }
    image: ecommerce/order-service:local
    environment:
      <<: *env
      GRPC_ADDR: ":50053"
      DATABASE_NAME: orders
      DATABASE_USER: order_svc
      DATABASE_PASSWORD: order_svc
      PRODUCT_SERVICE_ADDR: product-service:50052

  payment-service:
    <<: *service
    build: { context: ., args: { SERVICE: payment-service } }
    image: ecommerce/payment-service:local
    environment:
      <<: *env
      GRPC_ADDR: ":50055"
      DATABASE_NAME: payments
      DATABASE_USER: payment_svc
      DATABASE_PASSWORD: payment_svc
      ORDER_SERVICE_ADDR: order-service:50053

  cart-service:
    <<: *service
    build: { context: ., args: { SERVICE: cart-service } }
    image: ecommerce/cart-service:local
    environment:
      <<: *env
      GRPC_ADDR: ":50054"
      DATABASE_NAME: carts
      DATABASE_USER: cart_svc
      DATABASE_PASSWORD: cart_svc

  review-service:
    <<: *service
    build: { context: ., args: { SERVICE: review-service } }
    image: ecommerce/review-service:local
    environment:
      <<: *env
      GRPC_ADDR: ":50056"
      DATABASE_NAME: reviews
      DATABASE_USER: review_svc
      DATABASE_PASSWORD: review_svc

  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    image: ecommerce/api-gateway:local
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      AUTH_SERVICE_ADDR: auth-service:50051
      PRODUCT_SERVICE_ADDR: product-service:50052
      ORDER_SERVICE_ADDR: order-service:50053
      CART_SERVICE_ADDR: cart-service:50054
      PAYMENT_SERVICE_ADDR: payment-service:50055
      REVIEW_SERVICE_ADDR: review-service:50056
      INVENTORY_SERVICE_ADDR: inventory-service:50057
    depends_on:
      auth-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      cart-service: { condition: service_healthy }
      review-service: { condition: service_healthy }

  # --------------------------------------------------------------------------
  # Observability & tooling
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.4.0
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.6.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  postgres_data:
