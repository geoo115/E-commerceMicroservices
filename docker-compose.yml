version: "3.8"

services:
  # ======================
  # Infrastructure Services
  # ======================
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: usr
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: ecommerce
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis_cache
    restart: always
    ports:
      - "6380:6379"
    networks:
      - ecommerce-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka_broker
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ======================
  # Monitoring & Observability
  # ======================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - ecommerce-net
    depends_on:
      - api-gateway
      - auth-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ecommerce-net
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
    networks:
      - ecommerce-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - ecommerce-net
    depends_on:
      - kafka

  # ======================
  # Core Microservices
  # ======================
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/dockerfile
    container_name: api_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./api-gateway/config.yaml:/app/config.yaml
    networks:
      - ecommerce-net
    depends_on:
      - auth-service
      - product-service
      - order-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    restart: always
    environment:
      DATABASE_HOST: postgres_db
      DATABASE_USER: usr
      DATABASE_PASSWORD: test123
      DATABASE_SSLMODE: disable
      DATABASE_NAME: ecommerce_users
      DATABASE_PORT: 5432
      JWT_SECRET: "supersecretkey"
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      ADMIN_EMAIL: admin@example.com 
      ADMIN_PASSWORD: supersecurepassword  
    ports:
      - "50051:50051"
    networks:
      - ecommerce-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started


  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: usr
      DATABASE_PASSWORD: test123
      DATABASE_SSLMODE: disable
      DATABASE_NAME: ecommerce_products
      DATABASE_PORT: 5432
    networks:
      - ecommerce-net
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: ./order-service/dockerfile
    container_name: order_service
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: usr
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD: test123
      DATABASE_NAME: ecommerce_order
      DATABASE_PORT: 5432
      KAFKA_BROKER: kafka:9092
    networks:
      - ecommerce-net
    depends_on:
      - postgres
      - kafka

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: cart_service
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: usr
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD: test123
      DATABASE_NAME: ecommerce_cart
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - ecommerce-net
    depends_on:
      - postgres
      - redis

  payment-service:
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    container_name: payment_service
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: usr
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD: test123
      DATABASE_NAME: ecommerce_payment
      DATABASE_PORT: 5432
      KAFKA_BROKER: kafka:9092
    networks:
      - ecommerce-net
    depends_on:
      - postgres
      - kafka

  review-service:
    build:
      context: .
      dockerfile: ./review-service/Dockerfile
    container_name: review_service
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: usr
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD: test123
      DATABASE_NAME: ecommerce_review
      DATABASE_PORT: 5432
      KAFKA_BROKER: kafka:9092
    networks:
      - ecommerce-net
    depends_on:
      - postgres
      - kafka

  inventory-service:
    build:
      context: .
      dockerfile: ./inventory-service/Dockerfile
    container_name: inventory_service
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: usr
      DATABASE_SSLMODE: disable
      DATABASE_PASSWORD: test123
      DATABASE_NAME: ecommerce_inventory
      DATABASE_PORT: 5432
      KAFKA_BROKER: kafka:9092
    networks:
      - ecommerce-net
    depends_on:
      - postgres
      - kafka

  message-broker:
    build:
      context: ./message-broker
      dockerfile: Dockerfile
    container_name: message_broker
    restart: always
    environment:
      KAFKA_BROKER: kafka:9092
    networks:
      - ecommerce-net
    depends_on:
      - kafka

# ======================
# Volumes & Networks
# ======================
volumes:
  postgres_data:
  grafana_data:

networks:
  ecommerce-net:
    driver: bridge
