syntax = "proto3";

package order;

option go_package = "./proto";

service OrderService {
    rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
    rpc GetOrder(GetOrderRequest) returns (OrderResponse);
    rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
    rpc UpdateOrder(UpdateOrderRequest) returns (OrderResponse);
    rpc DeleteOrder(DeleteOrderRequest) returns (DeleteResponse);
}

message CreateOrderRequest {
    uint32 user_id = 1;
    repeated OrderItemRequest items = 2;
    // TotalAmount can be calculated server-side from order items if desired.
}

message OrderItemRequest {
    uint32 product_id = 1;
    int32 quantity = 2;
    double price = 3;
}

message GetOrderRequest {
    uint32 order_id = 1;
}

message ListOrdersRequest {
    uint32 user_id = 1; // Optional filter by user
    int32 page = 2;
    int32 limit = 3;
}

message UpdateOrderRequest {
    uint32 order_id = 1;
    string status = 2;
}

message DeleteOrderRequest {
    uint32 order_id = 1;
}

message OrderResponse {
    uint32 order_id = 1;
    uint32 user_id = 2;
    double total_amount = 3;
    string status = 4;
    repeated OrderItemResponse items = 5;
    string created_at = 6; // Optional: formatted timestamp
}

message OrderItemResponse {
    uint32 order_item_id = 1;
    uint32 product_id = 2;
    int32 quantity = 3;
    double price = 4;
}

message ListOrdersResponse {
    repeated OrderResponse orders = 1;
}

message DeleteResponse {
    bool success = 1;
}
